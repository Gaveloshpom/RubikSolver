<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
  <title>{{{ PRODUCT_NAME }}}</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1f2126; }
    /* touch-action: none keeps the browser from scrolling or zooming the page while the cube is dragged */
    #unity-canvas { display: block; width: 100%; height: 100%; background: #1f2126; outline: none; touch-action: none; }
    html, body { touch-action: none; -webkit-user-select: none; user-select: none; overscroll-behavior: none; }
    #loading {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
      color: #dde1e7; font: 18px system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    #bar { width: 260px; height: 6px; border-radius: 3px; background: #343841; overflow: hidden; }
    #fill { width: 0; height: 100%; background: #3f8cf2; transition: width 0.2s; }
    #error { max-width: 520px; color: #ff8a80; font-size: 14px; text-align: center; }
  </style>
</head>
<body>
  <!-- Full-window canvas: Unity matches the render size to the canvas size -->
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loading">
    <div>{{{ PRODUCT_NAME }}} {{{ PRODUCT_VERSION }}}</div>
    <div id="bar"><div id="fill"></div></div>
    <div id="error"></div>
  </div>
  <script>
    var buildUrl = "Build";
    var config = {
      dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
      frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
      codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#if MEMORY_FILENAME
      memoryUrl: buildUrl + "/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
      symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
      streamingAssetsUrl: "StreamingAssets",
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
    };

    var canvas = document.querySelector("#unity-canvas");
    var script = document.createElement("script");
    script.src = buildUrl + "/{{{ LOADER_FILENAME }}}";
    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        document.querySelector("#fill").style.width = (100 * progress) + "%";
      }).then(function () {
        document.querySelector("#loading").remove();
        canvas.focus();
      }).catch(function (message) {
        document.querySelector("#error").textContent = message;
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
